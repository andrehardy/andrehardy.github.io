<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liber VI — Cosmographia</title>
  <script src="./places.js"></script>
  <style>
    @font-face { font-family: "Cinzel"; font-weight: 400; font-style: normal; src: url("../fonts/cinzel-latin-400-normal.woff2") format("woff2"); font-display: swap; }
    @font-face { font-family: "Cinzel"; font-weight: 600 800; font-style: normal; src: url("../fonts/cinzel-latin-600-normal.woff2") format("woff2"); font-display: swap; }
    @font-face { font-family: "Cormorant Garamond"; font-weight: 400 700; font-style: normal; src: url("../fonts/cormorant-garamond-latin-600-normal.woff2") format("woff2"); font-display: swap; }
    @font-face { font-family: "Cormorant Garamond"; font-weight: 400; font-style: italic; src: url("../fonts/cormorant-garamond-latin-400-italic.woff2") format("woff2"); font-display: swap; }
    :root {
      --amber: #e7c56a;
      --iron: #14110d;
      --ink: #f3ead7;
      --ink-soft: #cbbfa6;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--iron); color: var(--ink); }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: "Cormorant Garamond", Georgia, serif;
      background:
        radial-gradient(ellipse 60% 40% at 50% 18%, rgba(231, 197, 106, 0.14), transparent 70%),
        var(--iron);
    }
    a { color: inherit; }
    .bar {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem 1.25rem;
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid rgba(231, 197, 106, 0.28);
    }
    .mark { text-decoration: none; display: grid; }
    .mark strong {
      font-family: Cinzel, serif;
      font-weight: 400;
      letter-spacing: 0.14em;
      font-size: 0.78rem;
    }
    .mark em { font-style: italic; color: var(--ink-soft); }
    nav { display: flex; flex-wrap: wrap; gap: 0.35rem 1rem; }
    nav a { font-family: Cinzel, serif; font-size: 0.72rem; letter-spacing: 0.08em; text-decoration: none; color: var(--ink-soft); }
    nav a:hover { color: var(--amber); }
    .chamber {
      position: relative;
      flex: 1;
      min-height: 0;
    }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    .ages {
      position: absolute;
      left: 50%;
      bottom: 1.25rem;
      transform: translateX(-50%);
      display: flex;
      gap: 0.4rem;
      z-index: 2;
    }
    .ages button {
      font-family: Cinzel, serif;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      color: var(--ink-soft);
      background: rgba(20, 17, 13, 0.72);
      border: 1px solid rgba(231, 197, 106, 0.28);
      padding: 0.45rem 0.7rem;
      cursor: pointer;
    }
    .ages button[aria-pressed="true"] {
      color: #1a140c;
      background: var(--amber);
      border-color: var(--amber);
    }
    .plaque {
      position: absolute;
      left: 1rem;
      top: 1rem;
      width: min(22rem, calc(100% - 2rem));
      z-index: 2;
      pointer-events: none;
    }
    .plaque h1 {
      font-family: Cinzel, serif;
      font-weight: 400;
      font-size: 1.35rem;
      margin: 0 0 0.2rem;
    }
    .plaque p { margin: 0.15rem 0; color: var(--ink-soft); font-size: 1.15rem; }
    .plaque .where { color: var(--ink); }
    @media (max-width: 640px) {
      .plaque h1 { font-size: 1.05rem; }
      .ages { width: calc(100% - 1rem); justify-content: center; flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <a class="mark" href="../../magic-codex/">
      <strong>LIBER VI · COSMOGRAPHIA</strong>
      <em>The seed of the gazetteer</em>
    </a>
    <nav aria-label="The house">
      <a href="../">The chronicon</a>
      <a href="../lineage/">The kinship</a>
      <a href="../../magic-registry/">The page</a>
      <a href="../../magic-codex/">The book</a>
    </nav>
  </header>
  <div class="chamber">
    <canvas id="globe" aria-label="The Cosmographia, a globe of the ages"></canvas>
    <div class="plaque" id="plaque">
      <h1 id="placeTitle">The known world</h1>
      <p id="placeWhere">Turn the globe. Choose an age. The shores of that age are the ones the stories touch.</p>
      <p id="placeYear"></p>
    </div>
    <div class="ages" role="group" aria-label="Ages of the Cosmographia">
      <button type="button" data-act="ACT_I" aria-pressed="true">Act I</button>
      <button type="button" data-act="ACT_II" aria-pressed="false">Act II</button>
      <button type="button" data-act="ACT_III" aria-pressed="false">Act III</button>
      <button type="button" data-act="ACT_IV" aria-pressed="false">Act IV</button>
    </div>
  </div>
  <script>
    const ACTS = {
      ACT_I: "Egypt, Olympus, and Rome",
      ACT_II: "The dark ages and the north",
      ACT_III: "Renaissance, Tudors, and witch trials",
      ACT_IV: "Enlightenment, gothic, and the modern night"
    };
    const LAND = [
      [[-9,36],[-8,43],[-5,48],[-2,51],[2,51],[8,54],[12,55],[18,60],[24,66],[30,70],[40,68],[48,60],[60,55],[80,55],[100,50],[120,55],[140,60],[160,62],[180,66],[180,70],[140,72],[100,75],[40,72],[10,62],[-5,58],[-8,51],[-10,44],[-9,36]],
      [[-10,36],[-8,32],[0,32],[10,32],[20,32],[32,31],[35,22],[42,12],[40,0],[30,-10],[20,-20],[15,-30],[18,-35],[25,-34],[32,-28],[35,-20],[40,-15],[43,-12],[40,0],[32,10],[20,15],[10,5],[0,5],[-5,15],[-15,20],[-17,15],[-16,12],[-10,5],[-15,10],[-17,21],[-10,30],[-10,36]],
      [[30,32],[35,28],[45,25],[55,27],[65,25],[75,22],[80,10],[90,22],[100,15],[105,0],[110,-8],[120,-8],[130,-5],[140,-15],[150,-20],[145,-35],[140,-38],[115,-35],[110,-25],[100,-5],[95,15],[80,8],[70,22],[50,12],[42,15],[35,30],[30,32]],
      [[-168,66],[-140,70],[-100,73],[-80,70],[-60,60],[-55,52],[-70,48],[-90,48],[-125,48],[-125,40],[-115,32],[-105,22],[-90,16],[-80,8],[-90,15],[-105,22],[-110,30],[-125,40],[-130,50],[-150,60],[-165,60],[-168,66]],
      [[-80,10],[-70,12],[-60,8],[-50,0],[-35,-5],[-40,-15],[-50,-22],[-60,-30],[-70,-40],[-75,-50],[-70,-55],[-65,-50],[-70,-40],[-75,-20],[-80,-5],[-78,5],[-80,10]],
      [[112,-12],[125,-14],[140,-12],[150,-18],[153,-28],[145,-38],[130,-35],[115,-34],[114,-25],[112,-12]]
    ];

    const data = window.COSMOGRAPHIA || { places: [], shores: [] };
    const sites = window.COSMOGRAPHIA_SITES || [];
    const canvas = document.getElementById("globe");
    const ctx = canvas.getContext("2d");
    let act = "ACT_I";
    let yaw = 18;
    let tilt = 0.35;
    let dragging = false;
    let downX = 0;
    let downY = 0;
    let lastX = 0;
    let lastY = 0;
    let selected = null;

    function spanOf(id) {
      const years = data.places.filter((p) => p.act === id).map((p) => p.year);
      if (!years.length) return { min: 0, max: 0 };
      return { min: Math.min(...years), max: Math.max(...years) };
    }

    function project(lat, lng, radius, cx, cy) {
      const la = lat * Math.PI / 180;
      const lo = (lng - yaw) * Math.PI / 180;
      let x = Math.cos(la) * Math.sin(lo);
      let y = Math.sin(la);
      let z = Math.cos(la) * Math.cos(lo);
      const c = Math.cos(tilt);
      const s = Math.sin(tilt);
      const y2 = y * c - z * s;
      const z2 = y * s + z * c;
      return { x: cx + x * radius, y: cy - y2 * radius, z: z2, front: z2 > 0.02 };
    }

    function ringPath(ring, radius, cx, cy) {
      const pts = ring.map(([lng, lat]) => project(lat, lng, radius, cx, cy));
      if (!pts.some((p) => p.front)) return null;
      return pts;
    }

    function strokeRing(pts, style) {
      ctx.beginPath();
      let open = false;
      for (const p of pts) {
        if (!p.front) { open = false; continue; }
        if (!open) { ctx.moveTo(p.x, p.y); open = true; }
        else ctx.lineTo(p.x, p.y);
      }
      ctx.strokeStyle = style;
      ctx.stroke();
    }

    function fillRing(pts, style) {
      ctx.beginPath();
      let started = false;
      for (const p of pts) {
        if (!started) { ctx.moveTo(p.x, p.y); started = true; }
        else ctx.lineTo(p.x, p.y);
      }
      ctx.closePath();
      ctx.fillStyle = style;
      ctx.fill();
    }

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = Math.max(1, rect.width) * dpr;
      canvas.height = Math.max(1, rect.height) * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }

    function draw() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      ctx.clearRect(0, 0, w, h);
      const radius = Math.min(w, h) * 0.36;
      const cx = w * 0.56;
      const cy = h * 0.46;
      const grd = ctx.createRadialGradient(cx - radius * 0.35, cy - radius * 0.4, radius * 0.1, cx, cy, radius);
      grd.addColorStop(0, "#3a3428");
      grd.addColorStop(1, "#100e0c");
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.fillStyle = grd;
      ctx.fill();
      ctx.lineWidth = 1;
      ctx.strokeStyle = "rgba(231,197,106,0.35)";
      ctx.stroke();

      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.clip();
      for (const land of LAND) {
        const pts = ringPath(land, radius, cx, cy);
        if (pts) fillRing(pts, "rgba(88, 78, 62, 0.55)");
      }
      const span = spanOf(act);
      for (const shore of data.shores) {
        const live = shore.end >= span.min && shore.start <= span.max;
        if (!live) continue;
        const pts = ringPath(shore.ring, radius, cx, cy);
        if (!pts) continue;
        fillRing(pts, "rgba(231,197,106,0.16)");
        ctx.lineWidth = 1.4;
        strokeRing(pts, "rgba(231,197,106,0.85)");
      }
      ctx.restore();

      const marks = data.places.filter((p) => p.act === act);
      for (const place of marks) {
        const p = project(place.lat, place.lng, radius, cx, cy);
        if (!p.front) continue;
        ctx.beginPath();
        ctx.arc(p.x, p.y, place === selected ? 5.5 : 3.2, 0, Math.PI * 2);
        ctx.fillStyle = place === selected ? "#fff4d2" : "#e7c56a";
        ctx.fill();
      }
      for (const site of sites) {
        if (!site || typeof site.lat !== "number") continue;
        const p = project(site.lat, site.lng, radius, cx, cy);
        if (!p.front) continue;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.strokeStyle = "#f4f0e6";
        ctx.stroke();
      }
    }

    function aimAtAct() {
      const marks = data.places.filter((p) => p.act === act);
      if (!marks.length) return;
      const lng = marks.reduce((s, p) => s + p.lng, 0) / marks.length;
      const lat = marks.reduce((s, p) => s + p.lat, 0) / marks.length;
      yaw = lng;
      tilt = Math.max(-0.6, Math.min(0.8, lat * Math.PI / 180));
    }

    function read(place) {
      selected = place;
      document.getElementById("placeTitle").textContent = place ? place.title : "The known world";
      document.getElementById("placeWhere").textContent = place ? place.where : ACTS[act];
      document.getElementById("placeYear").textContent = place
        ? (place.year < 0 ? `${Math.abs(place.year)} BCE` : `${place.year} CE`)
        : "";
      draw();
    }

    function pick(event) {
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      const radius = Math.min(rect.width, rect.height) * 0.36;
      const cx = rect.width * 0.56;
      const cy = rect.height * 0.46;
      let best = null;
      let bestD = 18;
      for (const place of data.places.filter((p) => p.act === act)) {
        const p = project(place.lat, place.lng, radius, cx, cy);
        if (!p.front) continue;
        const d = Math.hypot(p.x - x, p.y - y);
        if (d < bestD) { best = place; bestD = d; }
      }
      if (best) read(best);
    }

    document.querySelectorAll(".ages button").forEach((button) => {
      button.addEventListener("click", () => {
        act = button.dataset.act;
        document.querySelectorAll(".ages button").forEach((b) => {
          b.setAttribute("aria-pressed", b === button ? "true" : "false");
        });
        selected = null;
        aimAtAct();
        read(null);
        document.getElementById("placeWhere").textContent = ACTS[act];
      });
    });

    canvas.addEventListener("pointerdown", (event) => {
      dragging = true;
      downX = lastX = event.clientX;
      downY = lastY = event.clientY;
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener("pointerup", (event) => {
      const moved = Math.hypot(event.clientX - downX, event.clientY - downY);
      dragging = false;
      if (moved < 4) pick(event);
    });
    canvas.addEventListener("pointermove", (event) => {
      if (!dragging) return;
      yaw -= (event.clientX - lastX) * 0.35;
      tilt = Math.max(-1, Math.min(1, tilt + (event.clientY - lastY) * 0.005));
      lastX = event.clientX;
      lastY = event.clientY;
      draw();
    });

    aimAtAct();
    read(null);
    document.getElementById("placeWhere").textContent = ACTS[act];
    window.addEventListener("resize", resize);
    resize();
  </script>
</body>
</html>
